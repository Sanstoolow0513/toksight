[package]
name = "toksight-desktop"
version = "1.3.0"
description = "Local AI coding usage dashboard"
edition = "2021"
rust-version = "1.90"
license = "MIT"

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

[dependencies]
base64 = "0.22"
open = "5.4"
rand = "0.8"
reqwest = { version = "0.12", default-features = false }
rfd = { version = "0.17", default-features = false, features = ["common-controls-v6"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "=2.12.5", features = [] }

[features]
default = []
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
codegen-units = 1
lto = "thin"
strip = true
