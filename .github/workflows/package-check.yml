name: Package check

on:
  workflow_call:

permissions:
  contents: read

jobs:
  package:
    name: build, install and serve (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      # Regression check: a development proxy must never disable static export.
      TOKSIGHT_DEV_API: http://127.0.0.1:1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run check:package
