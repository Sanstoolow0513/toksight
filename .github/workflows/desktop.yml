name: Windows desktop

on:
  pull_request:
    paths:
      - 'desktop/**'
      - 'frontend/**'
      - 'src/**'
      - 'scripts/desktop-*.js'
      - '.github/workflows/desktop.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-package:
    name: Tauri x64 build and unsigned installer
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install stable Rust MSVC toolchain
        run: rustup update stable --no-self-update
      - name: Cache Rust dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            desktop/src-tauri/target
          key: windows-desktop-rust-${{ hashFiles('desktop/src-tauri/Cargo.lock') }}
      - name: Cache pinned Node archive
        uses: actions/cache@v4
        with:
          path: desktop/.cache
          key: windows-desktop-node-${{ hashFiles('desktop/runtime.json') }}
      - run: npm ci
      - run: npm run web:ci
      - run: npm run desktop:ci
      - name: Check offline sidecar protocol
        run: node --test test/desktop-service.test.js test/desktop-frontend.test.js test/webserver.test.js
      - name: Build Tauri app with bundled Node core
        run: npm run desktop:build
      - name: Check Rust bridge boundaries
        run: cargo test --manifest-path desktop/src-tauri/Cargo.toml --locked
      - name: Create ZIP and unsigned NSIS installer
        run: npm run desktop:package -- --no-build
      # Native window/screenshot checks require an interactive desktop and run
      # locally with desktop:check, not in the hosted runner's service session.
      - name: Upload unsigned desktop artifacts
        uses: actions/upload-artifact@v4
        with:
          name: toksight-desktop-win-x64-${{ github.run_number }}
          path: |
            dist/desktop/win-x64/tauri/*.zip
            dist/desktop/win-x64/tauri/*-setup.exe
            dist/desktop/win-x64/tauri/package-info.json
          if-no-files-found: error
          retention-days: 14
