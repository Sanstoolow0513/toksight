name: Release

on:
  push:
    branches: [release]

permissions:
  contents: read

concurrency:
  group: release-publish
  queue: max

jobs:
  test:
    name: tests (${{ matrix.os }}, node ${{ matrix.node-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - run: npm ci
      - run: npm test

  package:
    uses: ./.github/workflows/package-check.yml

  prepare:
    name: Check version and create tag
    needs: [test, package]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    outputs:
      mode: ${{ steps.plan.outputs.mode }}
      tag: ${{ steps.plan.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Check package version against npm and existing tags
        id: plan
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          git fetch origin refs/heads/release:refs/remotes/origin/release --tags
          if ! git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/release; then
            echo '::error::The release commit is no longer on the release branch.'
            exit 1
          fi
          node scripts/release-plan.js
      - name: Check npm publish token before tagging
        if: steps.plan.outputs.mode == 'publish'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo '::error::Configure the NPM_TOKEN repository secret before releasing.'
            exit 1
          fi
          npm whoami --registry=https://registry.npmjs.org
      - name: Create matching tag
        if: steps.plan.outputs.mode == 'publish'
        env:
          RELEASE_TAG: ${{ steps.plan.outputs.tag }}
        run: |
          set -euo pipefail
          if ! git show-ref --verify --quiet "refs/tags/$RELEASE_TAG"; then
            git tag "$RELEASE_TAG" "$GITHUB_SHA"
            git push origin "refs/tags/$RELEASE_TAG"
          fi

  publish:
    name: Publish to npm
    needs: prepare
    if: needs.prepare.outputs.mode != 'skip'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        if: needs.prepare.outputs.mode == 'publish'
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v6
        if: needs.prepare.outputs.mode == 'publish'
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - if: needs.prepare.outputs.mode == 'publish'
        run: npm ci
      - if: needs.prepare.outputs.mode == 'publish'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          npm publish --access public --provenance
      - if: needs.prepare.outputs.mode == 'recover'
        run: echo 'This version was already published by the same release commit.'

  release:
    name: GitHub Release
    needs: [prepare, publish]
    if: needs.prepare.outputs.mode != 'skip'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
